# atmosphere · Cargo.toml · Crate manifest and dependencies for the Atmosphere desktop app.
[package]
name = "atmosphere"
version = "0.2.0"
edition = "2021"
description = "A lightweight SoundCloud downloader for content you have the rights to."

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.2"
dirs = "7.0.0"
getrandom = "0.3"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.5"
notify = "8.2.2"
regex = "1.13.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["full"] }
trash = "5.4.0"
url = "2.5.8"
walkdir = "2.5.0"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
