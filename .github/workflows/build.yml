# atmosphere · build.yml · CI: runs the tests and builds installers for Windows, macOS (Apple Silicon + Intel) and Linux.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-13
            name: macos-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        shell: bash
        run: cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Portable executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: atmosphere-portable-${{ matrix.name }}
          path: target/release/atmosphere.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-${{ matrix.name }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app.tar.gz
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
          if-no-files-found: error
