# atmosphere · build.yml · CI: runs the tests and builds the Windows installers and portable app.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --locked 2>&1 | tee test.log; then
            grep -E "^---- |panicked at|^  left|^ right|error(\[E[0-9]+\])?:" test.log | head -40 | while IFS= read -r line; do echo "::error title=Test failure::$line"; done
            exit 1
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        shell: bash
        run: cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Portable executable
        uses: actions/upload-artifact@v4
        with:
          name: atmosphere-portable-windows-x64
          path: target/release/atmosphere.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-windows-x64
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: error
